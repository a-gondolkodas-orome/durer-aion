# Development overlay for docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Replaces the production backend command with the watching dev server and
# mounts the sources it watches, so backend changes reload without a rebuild.
# `docker-compose.yml` on its own runs the built server, as deployment does.
services:
  backend:
    # The Dockerfile's dev stage: no server build, since the watcher below
    # rebuilds over it the moment the container starts.
    build:
      context: .
      target: dev
    command: npm run dev:server
    environment:
      # `dev:server` starts with `scripts/prepare.mjs`, whose first job is to
      # install the tree if nothing has recorded one — and nothing has here. The
      # image's own `npm ci` (Dockerfile) leaves no stamp, the stamp lives inside
      # node_modules in the container's writable layer, and `stack:up` builds
      # with `COPY . .`, so any edit gives a new image, a new container and a
      # fresh layer. The check therefore found "no install recorded" every time
      # and deleted and refetched ~900 packages before the server started,
      # sometimes for longer than the healthcheck waits.
      #
      # In here the image owns the tree: it is installed at build, from the same
      # manifests, and a manifest change rebuilds the layer that installs it.
      # There is nothing for a check at start-up to add. On the host, where the
      # tree is the developer's, `dev:server` still runs it.
      - DURER_SKIP_DEPS=1
    volumes:
      # Mount backend source
      - ./apps/online-backend/src:/usr/src/app/apps/online-backend/src
      # Mount shared packages
      - ./packages/game:/usr/src/app/packages/game
      - ./packages/schemas:/usr/src/app/packages/schemas
      - ./packages/relay-bot:/usr/src/app/packages/relay-bot
      # Keep node_modules from image (avoid reinstall each time)
      # - /usr/src/app/node_modules
      # Give dist a volume of its own, so the watcher's output is not written
      # into the container's writable layer and does not outlive the container.
      # The dev stage builds nothing, so there is no image output to preserve.
      - /usr/src/app/apps/online-backend/dist
  postgres:
    ports:
      # Loopback only, and only in dev: enough for psql or a GUI client on the
      # host, while the base file keeps the deployed database unpublished.
      - 127.0.0.1:5432:5432
