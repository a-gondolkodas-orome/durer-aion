<!DOCTYPE html>

<head>
  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="A Dürer Verseny korábbi váltó feladatsorainak gyakorló oldala" />
  <link rel="apple-touch-icon" href="/logo192.png" />
  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->

      Notice the use of  in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "/favicon.ico" will

    -->
  <title>Váltók gyakorlása – Dürer Verseny</title>
  <script
    defer
    src="https://umami.durerinfo.hu/script.js"
    data-website-id="a4570941-4cef-4c19-9038-19c40554b2f7"
    data-domains="gyakorlo.durerinfo.hu"
    data-do-not-track="true"
  ></script>
  <style>
    latex-js {
      display: block;
      width: 100%;
      --textwidth: 100%!important;
      --marginleftwidth: 0!important;
      --marginrightwidth: 0!important;
      --size: '16px'!important;
    }
    latex-js .page {
      --marginleftwidth: 0!important;
    }
    /* When latex.js never loads, the raw LaTeX source is all a task can show; keep its
       line breaks rather than collapsing the whole exercise into one run-on block. */
    latex-js:not(:defined) {
      white-space: pre-wrap;
    }
  </style>
  <script type="module">
    // Deliberately a dynamic import: Vite bundles every module script in this file into the
    // one entry chunk, so as a static import an unreachable cdn.jsdelivr.net aborted that
    // chunk before the app mounted and left the page blank instead of merely unformatted.
    // Pinned, so a release reaches the competition only as a visible bump; check the math
    // rendering when moving it (the monthly dependency report reminds you to look for one).
    const latexJs = "https://cdn.jsdelivr.net/npm/latex.js@0.12.6/dist/latex.mjs";
    // latex.js links KaTeX's stylesheet inside each task's shadow root, where Chromium ignores its
    // @font-face rules, so every math font would fall back to a system one (ℕ as a plain N).
    // Linked in the document too, the fonts are registered where the shadow root sees them. Added
    // by script, it does not hold up the page either, and it loads alongside latex.js rather than
    // after it, so tasks are not first laid out in the fallback fonts.
    const katexCss = document.createElement("link");
    katexCss.rel = "stylesheet";
    katexCss.href = new URL("css/katex.css", latexJs).href;
    document.head.append(katexCss);
    import(latexJs)
      .then(({ LaTeXJSComponent }) => customElements.define("latex-js", LaTeXJSComponent))
      .catch((error) => console.error("latex.js could not be loaded; tasks fall back to their LaTeX source", error))
  </script>
  <script type="module">
    import { Buffer } from "buffer";
    import process from "process";
    window.Buffer = Buffer;
    window.process = process;
  </script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <script type="module" src="/src/index.tsx"></script>  
  <div id="root"></div>
</body>

</html>
