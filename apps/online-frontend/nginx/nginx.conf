# The backend takes the session cookie's Secure flag from X-Forwarded-Proto
# (apps/online-backend/src/server/team_session.ts). This nginx is where TLS
# terminates when DEPLOYMENT.md's certbot setup is followed, so it reports its
# own scheme — unless a proxy in front already said, in which case that wins.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen       80;

    location /socket.io/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
    location /games {
      proxy_pass http://backend:8000;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    #custom admin endpoints
    location /team {
      proxy_pass http://backend:8000;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
    location /game {
      proxy_pass http://backend:8000;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
