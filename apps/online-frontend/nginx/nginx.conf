# The backend takes the session cookie's Secure flag from X-Forwarded-Proto
# (apps/online-backend/src/server/team_session.ts). TLS terminates in this
# nginx when DEPLOYMENT.md's certbot setup is followed, so its own scheme is
# the truth — a client's X-Forwarded-Proto is never passed through.
server {
    listen       80;

    location /socket.io/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /games {
      proxy_pass http://backend:8000;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    #custom admin endpoints
    location /team {
      proxy_pass http://backend:8000;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /game {
      proxy_pass http://backend:8000;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
