# The backend takes the session cookie's Secure flag from X-Forwarded-Proto
# (apps/online-backend/src/server/team_session.ts). TLS terminates in this
# nginx when docs/DEPLOYMENT.md's certbot setup is followed, so its own scheme is
# the truth — a client's X-Forwarded-Proto is never passed through.
#
# X-Forwarded-For is the client the backend counts join attempts against
# (apps/online-backend/src/server/rate_limit.ts). It is $remote_addr, not
# $proxy_add_x_forwarded_for: appending to what the client sent would leave a
# forged address first in the list, and koa reads the first one — every client
# could then pick its own bucket. There is no proxy in front of this one whose
# header would be worth keeping.
server {
    listen       80;

    # TLS, when there is any: the deployment mounts a file here with its `listen 443 ssl`,
    # its certificate and its redirect (docs/DEPLOYMENT.md § 8). A wildcard matching nothing is
    # not an error, so the local stack and the dry run start on port 80 with no certificate
    # to point at. It is an include rather than an edit to this file so that a deployment
    # adds a file instead of carrying a modified tracked one, and `git pull` on it never
    # has to merge the X-Forwarded-Proto lines below.
    include /etc/nginx/tls/*.conf;

    location /socket.io/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /games {
      proxy_pass http://backend:8000;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    #custom admin endpoints
    location /team {
      proxy_pass http://backend:8000;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /game {
      proxy_pass http://backend:8000;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Without a Cache-Control, a browser keeps a file with a Last-Modified for a tenth of its age
    # without asking (RFC 9111 § 4.2.2), so after a deploy a returning visitor can be served the
    # previous index.html, favicon or watermark for days. Unhashed names are therefore
    # revalidated on every load, a 304 when unchanged; Vite's content-hashed bundles under
    # /assets/ never change under one name and are kept for good. try_files is not inherited, so
    # a bundle that is gone answers 404 there, not with index.html under a script's name.
    #
    # An add_header here drops every add_header the server block inherits, so one added at
    # server level (an HSTS line in nginx-tls.conf, say) has to be repeated in both locations.
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
