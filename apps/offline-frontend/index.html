<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="A Dürer Verseny online fordulójának próbafelülete" />
  <!-- Both deploys of this app are handed to testers rather than found: the public
       /proba-verseny/ is unlinked, and the year's build is guarded only by an unguessable
       repository name (docs/DEPLOYMENT.md, "Deploying the dry run for testers"). A robots.txt cannot say so
       — it is read only at an origin root, and neither deploy serves this app from one. Nor
       may one disallow the crawl: a crawler that never fetches the page never reads this tag,
       and the URL can still be listed on the strength of a link alone. -->
  <meta name="robots" content="noindex" />
  <!-- Sends only from gyakorlo.durerinfo.hu: a visit to the public /proba-verseny/ shows
       whether anyone finds it, and the year's build, on its own domain, reports nothing. -->
  <script
    defer
    src="https://umami.durerinfo.hu/script.js"
    data-website-id="a4570941-4cef-4c19-9038-19c40554b2f7"
    data-domains="gyakorlo.durerinfo.hu"
    data-do-not-track="true"
  ></script>
  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="/manifest.json" />
  <title>Dürer Verseny – próbaverseny</title>
  <style>
    latex-js {
      display: block;
      width: 100%;
      --textwidth: 100%!important;
      --marginleftwidth: 0!important;
      --marginrightwidth: 0!important;
      --size: '16px'!important;
    }
    latex-js .page {
      --marginleftwidth: 0!important;
    }
    /* When latex.js never loads, the raw LaTeX source is all a task can show; keep its
       line breaks rather than collapsing the whole exercise into one run-on block. */
    latex-js:not(:defined) {
      white-space: pre-wrap;
    }
  </style>
  <script type="module">
    // Deliberately a dynamic import: Vite bundles every module script in this file into the
    // one entry chunk, so as a static import an unreachable cdn.jsdelivr.net aborted that
    // chunk before the app mounted and left the page blank instead of merely unformatted.
    // Pinned, so a release reaches the competition only as a visible bump; check the math
    // rendering when moving it (the monthly dependency report says when there is one).
    const latexJs = "https://cdn.jsdelivr.net/npm/latex.js@0.12.6/dist/latex.mjs";
    import(latexJs)
      .then(({ LaTeXJSComponent }) => {
        // latex.js links KaTeX's stylesheet inside each task's shadow root, where Chromium ignores
        // its @font-face rules, so every math font would fall back to a system one (ℕ as a plain
        // N). Linked in the document too, the fonts are registered where the shadow root sees them.
        const katexCss = document.createElement("link");
        katexCss.rel = "stylesheet";
        katexCss.href = new URL("css/katex.css", latexJs).href;
        document.head.append(katexCss);
        customElements.define("latex-js", LaTeXJSComponent);
      })
      .catch((error) => console.error("latex.js could not be loaded; tasks fall back to their LaTeX source", error))
  </script>
  <script type="module">
    import { Buffer } from "buffer";
    import process from "process";
    window.Buffer = Buffer;
    window.process = process;
  </script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <script type="module" src="/src/index.tsx"></script>  
  <div id="root"></div>
</body>

</html>
