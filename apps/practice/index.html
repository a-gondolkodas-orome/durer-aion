<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Dürer játékok</title>

      data-website-id="a4570941-4cef-4c19-9038-19c40554b2f7"
      data-domains="jatek.durerinfo.hu"
      data-do-not-track="true"
      data-auto-track="false"></script>
    <script>
      (function() {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <script>
      window.addEventListener('touchstart', function() {
        document.documentElement.classList.add('using-touch');
      }, { passive: true });
      window.addEventListener('pointermove', function(e) {
        if (e.pointerType === 'mouse') document.documentElement.classList.remove('using-touch');
      }, { passive: true });
    </script>
    <link rel="stylesheet" href="/src/styles.css">
    <link rel="icon" href="data:,">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
