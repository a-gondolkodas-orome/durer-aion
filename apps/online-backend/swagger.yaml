# Written by hand. apps/online-backend/src/server/swagger.test.ts fails when
# the routes here and the ones router.ts serves differ.
openapi: 3.0.0
info:
  title: Teams and Games API
  version: 1.0.0
  description: >
    API for managing teams, games, and matches. A request the server refuses
    is answered with an ApiError body, `{ code, message }`; the code says why,
    and is what a client reads.

servers:
  - url: http://localhost:8000
    description: Local development server

paths:
  /game/admin/{matchId}/logs:
    get:
      summary: Get log data for a specific match
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      security:
      - basicAdminAuth: []
      tags:
      - admin
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"
        "404":
          description: Match not found

  /game/admin/{matchId}/state:
    get:
      summary: Get state data for a specific match
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      security:
      - basicAdminAuth: []
      tags:
      - admin
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/State"
        "404":
          description: Match not found

  /game/admin/{matchId}/addminutes/{minutes}:
    post:
      summary: Add extra time to a specific match
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
        - name: minutes
          in: path
          required: true
          schema:
            type: integer
      security:
      - basicAdminAuth: []
      tags:
      - admin
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddMinutesResponse"
        "404":
          description: Match not found
        "500":
          description: Team not found
        "409":
          description: >
            STALE_MATCH_ID, the match is not the team's current one; or
            MATCH_FINISHED, the match is over
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /team/admin/{teamID}/reset/strategy:
    post:
      summary: Reset team's strategy
      description: Note that this request only resets this game's field in teamState. The user will not notice anything during the game, unless he refreshes the page.
      parameters:
        - name: teamID
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/GUID"
      security:
      - basicAdminAuth: []
      tags:
      - admin
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamModel"
        "404":
          description: Team not found

  /team/admin/{teamID}/reset/relay:
    post:
      summary: Reset team's relay
      description: Note that this request only resets this game's field in teamState. The user will not notice anything during the game, unless he refreshes the page.
      parameters:
        - name: teamID
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/GUID"
      security:
      - basicAdminAuth: []
      tags:
      - admin
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamModel"
        "404":
          description: Team not found

  /team/admin/{teamID}/start-window:
    put:
      summary: Give a team a start window of its own, or take it away
      description: The team's window replaces its competition's. A null opensAt takes it away. ISO 8601 with an offset.
      parameters:
        - name: teamID
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/GUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                opensAt:
                  type: string
                  nullable: true
                  example: "2026-11-21T15:00+01:00"
                closesAt:
                  type: string
                  nullable: true
                  example: "2026-11-21T21:30+01:00"
      security:
      - basicAdminAuth: []
      tags:
      - admin
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamModel"
        "400":
          description: Not a start window
        "404":
          description: Team not found

  /team/admin/all:
    get:
      summary: Get all teams as full objects
      security:
      - basicAdminAuth: []
      tags:
      - admin
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamModel"
  /team/admin/competitions:
    get:
      summary: The competitions teams can be imported into, whose ids the import's Competition column takes
      security:
      - basicAdminAuth: []
      tags:
      - admin
      responses:
        "200":
          description: Each registered competition's id and metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    metadata:
                      type: object
                      description: The competition's metadata, as `schemas` types it
                    startWindow:
                      allOf:
                      - $ref: "#/components/schemas/StartWindow"
                      nullable: true
                      description: >
                        The start window in force: the one set through the
                        route below, else the one the competition's config
                        gives. Null for any time.
                    configStartWindow:
                      allOf:
                      - $ref: "#/components/schemas/StartWindow"
                      nullable: true
                      description: The one the competition's config gives, which a window set through the route below replaces.
                    storedIn:
                      type: string
                      enum: [code, database]
                      description: Where the competition is held. One in code is never written to the database.
    post:
      summary: Create a competition in the database, or, with dryRun, say what that would do
      description: >
        The body is as the PUT below takes it, the competition's id a fresh
        one: no competition or problem holds it, in code or in the database.
        It is written, with the new problems its relay brings, only if it
        keeps the validator's rules and no id is taken; no team can have
        started it, so no lock applies. The answer is the report either way,
        `started` always false; the messages are Hungarian.
      security:
      - basicAdminAuth: []
      tags:
      - admin
      parameters:
      - name: dryRun
        in: query
        required: false
        description: "1: write nothing, answer what the write would do"
        schema:
          type: string
          enum: ["1"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                competition:
                  type: object
                  description: The competition's config, as `CompetitionConfig` types it
                problems:
                  type: array
                  description: New problems, as `Problem` types them, each used by the relay and its id taken by nothing yet
                  items:
                    type: object
      responses:
        "200":
          description: The report, written or not, as the PUT below answers it
        "401":
          description: Not an organiser
        "415":
          description: The body is not JSON
  /team/admin/strategy-games:
    get:
      summary: Every strategy game a competition can name, for the new competition's form
      security:
      - basicAdminAuth: []
      tags:
      - admin
      responses:
        "200":
          description: The games' ids
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          description: Not an organiser
  /team/admin/competitions/import:
    post:
      summary: Write the competitions and problems of a bundle to the database, all of them or none
      description: >
        The body is a bundle: the two maps a problem bank file exports, with a
        header naming the format. Nothing is written if any part of it breaks
        the rules, or has an id the code or the database already holds. The
        answer is a report either way, its messages in Hungarian.
      security:
      - basicAdminAuth: []
      tags:
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format, version, competitions, problems]
              properties:
                format:
                  type: string
                  enum: [durer-competitions]
                version:
                  type: integer
                  enum: [1]
                competitions:
                  type: object
                  description: Competitions by id, as `CompetitionBank` types them
                problems:
                  type: object
                  description: Problems by id, as `ProblemBank` types them
      responses:
        "200":
          description: What was written, or why nothing was
          content:
            application/json:
              schema:
                type: object
                properties:
                  written:
                    type: boolean
                  competitions:
                    type: array
                    items:
                      type: string
                    description: The ids of the competitions written
                  problems:
                    type: array
                    items:
                      type: string
                    description: The ids of the problems written
                  errors:
                    type: array
                    items:
                      type: string
                    description: Why nothing was written, one line per finding, each naming what it is about
        "415":
          description: The body is not JSON, or there is none
  /team/admin/competitions/export:
    get:
      summary: The bundle of every competition and problem the database holds, which the import takes
      description: >
        As they are stored, unvalidated, so that one the rules have since come
        to refuse can still be taken out; the import validates it. The relays'
        problems held in code the bundle refers to, as the import allows.
      security:
      - basicAdminAuth: []
      tags:
      - admin
      responses:
        "200":
          description: The bundle, in the shape the import's body takes
          content:
            application/json:
              schema:
                type: object
                properties:
                  format:
                    type: string
                    enum: [durer-competitions]
                  version:
                    type: integer
                    enum: [1]
                  competitions:
                    type: object
                  problems:
                    type: object
  /team/admin/competitions/{competitionId}:
    get:
      summary: One competition whole, for its admin page, its relay's answers included
      description: >
        In-code and database competitions alike. The relay's problems are in
        play order, and each lists every use any listed competition's relay
        makes of it, this one's included: what a fix to the problem reaches.
      security:
      - basicAdminAuth: []
      tags:
      - admin
      parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The competition's row of the list above, its config, and its relay's problems
          content:
            application/json:
              schema:
                type: object
                description: The list's fields (id, metadata, startWindow, configStartWindow, storedIn), and these
                properties:
                  competition:
                    type: object
                    description: The competition's config, as `CompetitionConfig` types it
                  relayProblems:
                    type: array
                    items:
                      type: object
                      properties:
                        problem:
                          type: object
                          description: The problem, answer included, as `Problem` types it
                        points:
                          type: integer
                        storedIn:
                          type: string
                          enum: [code, database]
                        uses:
                          type: array
                          items:
                            type: object
                            properties:
                              competitionId:
                                type: string
                              metadata:
                                type: object
                              position:
                                type: integer
                                description: 1-based, in play order
                              points:
                                type: integer
                  strategyGameIds:
                    type: array
                    description: Every strategy game a competition can name, for the edit form to offer
                    items:
                      type: string
                  started:
                    type: boolean
                    description: Whether a team of the competition has started a match, which locks its relay's problems
        "401":
          description: Not an organiser
        "404":
          description: No competition with this id
    put:
      summary: Replace a competition, or, with dryRun, say what that would do
      description: >
        The body is the competition whole, its id unchanged, and the new
        problems its relay brings, which nothing holds yet: written with it in
        one transaction, or not at all. A problem already held changes on its
        own route, never here. One held in the database is written only if it
        keeps the validator's rules and, once a team of it has started a match,
        the locks: no language taken away, no match added or taken away, and
        the relay's problems, their order and points as they are. Its window
        replaces any set apart from it. Of one held in code only the start
        window may change: it is stored apart, and the code's own window given
        back takes that away. The answer is the report either way; the
        messages are Hungarian.
      security:
      - basicAdminAuth: []
      tags:
      - admin
      parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
      - name: dryRun
        in: query
        required: false
        description: "1: write nothing, answer what the write would do"
        schema:
          type: string
          enum: ["1"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                competition:
                  type: object
                  description: The competition's config, as `CompetitionConfig` types it
                problems:
                  type: array
                  description: >
                    New problems, as `Problem` types them, each used by the relay
                    and its id taken by nothing yet: one added in the relay's
                    editor, or a copy of a shared one
                  items:
                    type: object
      responses:
        "200":
          description: The report, written or not
          content:
            application/json:
              schema:
                type: object
                properties:
                  written:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
                  warnings:
                    type: array
                    items:
                      type: string
                  started:
                    type: boolean
                    description: Whether a team of the competition has started a match, which the locks follow
        "401":
          description: Not an organiser
        "404":
          description: No competition with this id
        "415":
          description: The body is not JSON
  /team/admin/problems:
    get:
      summary: Search the database's problems, for the relay editor's picker
      description: >
        Database problems only, as stored, answers included. With
        `competition`, the ones its relay uses, in its order; by slug
        otherwise. At most 50, `truncated` saying whether more match.
      security:
      - basicAdminAuth: []
      tags:
      - admin
      parameters:
      - name: q
        in: query
        required: false
        description: Part of the id or slug, case ignored
        schema:
          type: string
      - name: competition
        in: query
        required: false
        description: Only the problems this competition's relay uses
        schema:
          type: string
      responses:
        "200":
          description: The matching problems
          content:
            application/json:
              schema:
                type: object
                properties:
                  problems:
                    type: array
                    items:
                      type: object
                      properties:
                        problem:
                          type: object
                          description: The problem, as `Problem` types it
                        storedIn:
                          type: string
                          enum: [database]
                        uses:
                          type: array
                          description: Every use a relay makes of the problem, as on `GET /team/admin/problems/{problemId}`
                          items:
                            type: object
                  truncated:
                    type: boolean
        "401":
          description: Not an organiser
        "404":
          description: No competition with the id `competition` gives
  /team/admin/problems/{problemId}:
    get:
      summary: One problem, for its editor, answer included
      description: >
        As stored, unvalidated, so a stored problem the rules have since come
        to refuse can be opened and mended.
      security:
      - basicAdminAuth: []
      tags:
      - admin
      parameters:
      - name: problemId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The problem, where it is held, its uses and its lock
          content:
            application/json:
              schema:
                type: object
                properties:
                  problem:
                    type: object
                    description: The problem, as `Problem` types it
                  storedIn:
                    type: string
                    enum: [code, database]
                  uses:
                    type: array
                    description: Every use a relay makes of the problem, in-code and database competitions alike
                    items:
                      type: object
                      properties:
                        competitionId:
                          type: string
                        metadata:
                          type: object
                        position:
                          type: integer
                          description: 1-based, in play order
                        points:
                          type: integer
                  answerLocked:
                    type: boolean
                    description: Whether a team of a competition using the problem has started a match, which locks the answer
        "401":
          description: Not an organiser
        "404":
          description: No problem with this id
    put:
      summary: Replace a problem held in the database, or, with dryRun, say what that would do
      description: >
        The body is the problem whole, its id unchanged. Written only if it
        keeps the validator's rules, still has content in a language of every
        competition using it, and, once a team of one of those has started a
        match, keeps its answer. A started match keeps the problems it was
        created with, so the change reaches the matches started after it. One
        held in code changes only with a deploy. The answer is the report
        either way; the messages are Hungarian.
      security:
      - basicAdminAuth: []
      tags:
      - admin
      parameters:
      - name: problemId
        in: path
        required: true
        schema:
          type: string
      - name: dryRun
        in: query
        required: false
        description: "1: write nothing, answer what the write would do"
        schema:
          type: string
          enum: ["1"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                problem:
                  type: object
                  description: The problem, as `Problem` types it
      responses:
        "200":
          description: The report, written or not
          content:
            application/json:
              schema:
                type: object
                properties:
                  written:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
                  warnings:
                    type: array
                    items:
                      type: string
                  answerLocked:
                    type: boolean
                    description: Whether a team of a competition using the problem has started a match, which locks the answer
                  uses:
                    type: array
                    description: Every use a relay makes of the problem, in-code and database competitions alike
                    items:
                      type: object
                      properties:
                        competitionId:
                          type: string
                        metadata:
                          type: object
                        position:
                          type: integer
                          description: 1-based, in play order
                        points:
                          type: integer
        "401":
          description: Not an organiser
        "404":
          description: No problem with this id
        "415":
          description: The body is not JSON
  /team/admin/import:
    put:
      summary: Import teams from a TSV file
      description: |
        This endpoint allows admins to upload a TSV file with team information. The file must be UTF-8 encoded, with a header naming its columns: "Teamname" and "Competition" (required; the competition the row's team enters, by its id or by edition, round and category such as "20 online C"), "Email", "Other", "ID", "Login Code", "Credentials", "Opens At" and "Closes At" (optional; the last two are the team's own start window, ISO 8601 with an offset, in place of its competition's).
      security:
        - basicAdminAuth: []
      tags:
        - admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The TSV file to be uploaded, its name ending in .tsv
              required:
                - file
      responses:
        "200":
          description: Teams imported successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  successful:
                    type: integer
                    description: The number of successfully imported teams
                  failed:
                    type: integer
                    description: The number of teams that failed to import
                  export_table:
                    type: array
                    items:
                      type: array
                      items:
                        type: string
                  logs:
                    type: object
                    properties:
                      sev:
                        type: array
                        items:
                          type: string
                          enum: ["info", "warn", "error"]
                          description: Severity level of log messages
                      value:
                        type: array
                        items:
                          type: string
                        description: Log messages
        "400":
          description: IMPORT_NO_FILE, IMPORT_MULTIPLE_FILES, or IMPORT_NOT_TSV
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /team/join:
    post:
      summary: Log a team in
      description: >
        The join code is the team's login secret, so it travels in the body,
        never in the path. The answer sets the session cookie that the
        /team/me routes read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  example: "000-0000-000"
      tags:
      - user
      responses:
        "204":
          description: Logged in; the session cookie is set
          headers:
            Set-Cookie:
              schema:
                type: string
                example: durer_team=8eae8669-125c-42e5-8b49-89afbac31679; path=/team/me; httponly; samesite=lax
        "400":
          description: No join code in the body
        "404":
          description: UNKNOWN_JOIN_CODE, no team has this join code
        "415":
          description: The body is not JSON, or there is none — a form post cannot log a team in
        "429":
          description: TOO_MANY_ATTEMPTS, too many wrong codes from this client; Retry-After says for how long

  /team/me/logout:
    post:
      summary: Log the team out
      description: >
        Expires the session cookie. Succeeds with no session too. The body
        must be JSON — an empty object will do — so that a form another site
        submits cannot log the team out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      tags:
      - user
      responses:
        "204":
          description: Logged out
        "415":
          description: The body is not JSON, or there is none

  /team/me:
    get:
      summary: Get the logged-in team's data
      security:
      - teamSession: []
      tags:
      - user
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTeamView"
        "401":
          description: No session

  /team/me/strategy-client.js:
    get:
      summary: The team's started strategy game, served by nginx through X-Accel-Redirect (#643)
      security:
      - teamSession: []
      tags:
      - user
      responses:
        "200":
          description: Empty; X-Accel-Redirect names the game's file
        "401":
          description: No session
        "404":
          description: The team has not started its strategy match

  /team/me/relay/play:
    post:
      summary: Let the logged-in team start a RELAY match
      security:
      - teamSession: []
      tags:
      - user
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedMatch"
        "401":
          description: No session
        "403":
          description: Not allowed to start — the team already started this match or is playing the other, the competition has no such match, or it is outside the team's start window

  /team/me/strategy/play:
    post:
      summary: Let the logged-in team start a STRATEGY match
      security:
      - teamSession: []
      tags:
      - user
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedMatch"
        "401":
          description: No session
        "403":
          description: Not allowed to start — the team already started this match or is playing the other, the competition has no such match, or it is outside the team's start window

  /team/me/strategy/view:
    post:
      summary: Take the logged-in team back to its finished STRATEGY match, to look at the board as it ended
      security:
      - teamSession: []
      tags:
      - user
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTeamView"
        "401":
          description: No session
        "403":
          description: Not at home, the strategy match has not ended, or the relay is in progress

  /team/me/gohome:
    post:
      summary: Let the logged-in team set their PageState to HOME
      security:
      - teamSession: []
      tags:
      - user
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTeamView"
        "401":
          description: No session
        "403":
          description: Not allowed, match in progress

components:
  securitySchemes:
   basicAdminAuth:
    type: http
    scheme: basic
   teamSession:
    type: apiKey
    in: cookie
    name: durer_team
    description: >
      The team's GUID, set by POST /team/join and set afresh by every /team/me
      request it admits. HttpOnly, SameSite=Lax, path /team/me.
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - JOIN_INVALID_BODY
            - INVALID_START_WINDOW
            - IMPORT_NO_FILE
            - IMPORT_MULTIPLE_FILES
            - IMPORT_NOT_TSV
            - NOT_LOGGED_IN
            - START_NOT_ALLOWED
            - NO_SUCH_MATCH
            - COMPETITION_NOT_STARTED
            - COMPETITION_OVER
            - VIEW_NOT_ALLOWED
            - MATCH_IN_PROGRESS
            - UNKNOWN_JOIN_CODE
            - TEAM_NOT_FOUND
            - MATCH_NOT_FOUND
            - GAME_NOT_FOUND
            - COMPETITION_NOT_FOUND
            - PROBLEM_NOT_FOUND
            - STALE_MATCH_ID
            - MATCH_FINISHED
            - JSON_REQUIRED
            - TOO_MANY_ATTEMPTS
        message:
          type: string
          description: English, for a person reading the response; clients show their own translation of the code

    GUID:
      type: string
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
      example: "8eae8669-125c-42e5-8b49-89afbac31679"

    MatchStatus:
      oneOf:
        - $ref: "#/components/schemas/NotStartedMatchStatus"
        - $ref: "#/components/schemas/InProgressMatchStatus"
        - $ref: "#/components/schemas/FinishedMatchStatus"

    NotStartedMatchStatus:
      type: object
      properties:
        state:
          type: string
          enum: ["NOT STARTED"]

    InProgressMatchStatus:
      type: object
      properties:
        state:
          type: string
          enum: ["IN PROGRESS"]
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        matchID:
          type: string

    FinishedMatchStatus:
      type: object
      properties:
        state:
          type: string
          enum: ["FINISHED"]
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        matchID:
          type: string
        score:
          type: number

    PublicTeamView:
      description: >
        What a team is served about itself — the row without its secrets. The
        GUID is one of them: it is the session cookie's value, so serving it
        here would hand any script on the page the session. Note that
        boardgame.io still discloses the same GUID as the match's player name
        once a team has started a match, so this narrows where the session
        travels rather than closing it off — see issue #434.
      type: object
      properties:
        teamName:
          type: string
        category:
          type: string
        competition:
          type: object
          nullable: true
          description: >
            The team's competition without its relay's problems: id, languages,
            the relay's duration, the strategy game and its duration, and
            metadata. Null for a competition the server no longer has.
        startWindow:
          allOf:
          - $ref: "#/components/schemas/StartWindow"
          nullable: true
          description: >
            When the team may start its matches: its own window, else its
            competition's. Null for any time.
        serverTime:
          type: string
          format: date-time
          description: >
            The server's clock as it answers. The page judges the start window
            by it, not by the browser's clock, since the server decides.
        credentials:
          type: string
        pageState:
          type: string
          enum: ["DISCLAIMER", "HOME", "RELAY", "STRATEGY"]
        relayMatch:
          $ref: "#/components/schemas/MatchStatus"
        strategyMatch:
          $ref: "#/components/schemas/MatchStatus"

    TeamModel:
      type: object
      properties:
        teamId:
          type: string
        joinCode:
          type: string
        teamName:
          type: string
        competitionId:
          type: string
        startOpensAt:
          type: string
          nullable: true
          description: The team's own start window's start, ISO 8601 with an offset, in place of its competition's window.
        startClosesAt:
          type: string
          nullable: true
          description: Its end, set only with startOpensAt; null leaves the window open.
        category:
          type: string
        credentials:
          type: string
        email:
          type: string
        pageState:
          type: string
          enum: ["DISCLAIMER", "HOME", "RELAY", "STRATEGY"]
        relayMatchID:
          type: string
          nullable: true
          description: The team's current relay match, the column the status below is read from.
        strategyMatchID:
          type: string
          nullable: true
          description: The team's current strategy match, the column the status below is read from.
        relayMatch:
          $ref: "#/components/schemas/MatchStatus"
        strategyMatch:
          $ref: "#/components/schemas/MatchStatus"
        other:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StartWindow:
      type: object
      description: When a team may start either match. ISO 8601 with an offset; without a closesAt it stays open.
      required: [opensAt]
      properties:
        opensAt:
          type: string
          example: "2026-11-20T15:00+01:00"
        closesAt:
          type: string
          example: "2026-11-20T21:30+01:00"

    ActionShape:
      type: string
      enum: ["MAKE_MOVE", "GAME_EVENT", "UNDO", "REDO"]

    Operation:
      type: object
      # Define properties for Operation if known

    LogEntry:
      type: object
      properties:
        action:
          $ref: "#/components/schemas/ActionShape"
        _stateID:
          type: integer
        turn:
          type: integer
        phase:
          type: string
        redact:
          type: boolean
        automatic:
          type: boolean
        metadata:
          type: object
        patch:
          type: array
          items:
            $ref: "#/components/schemas/Operation"
      required:
        - action
        - _stateID
        - turn
        - phase

    Ctx:
      type: object
      # Define properties for Ctx if known

    PluginState:
      type: object
      # Define properties for PluginState if known

    Undo:
      type: object
      # Define properties for Undo if known

    State:
      type: object
      properties:
        G:
          type: object
          description: The game state. Structure depends on the specific game implementation.
        ctx:
          $ref: "#/components/schemas/Ctx"
        deltalog:
          type: array
          items:
            $ref: "#/components/schemas/LogEntry"
        plugins:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PluginState"
        _undo:
          type: array
          items:
            $ref: "#/components/schemas/Undo"
        _redo:
          type: array
          items:
            $ref: "#/components/schemas/Undo"
        _stateID:
          type: integer
      required:
        - G
        - ctx
        - plugins
        - _stateID

    AddMinutesResponse:
      type: object
      properties:
        updatedEndTime:
          type: string
          format: date-time
        matchID:
          type: string
        team:
          $ref: "#/components/schemas/TeamModel"

    CreatedMatch:
      type: object
      properties:
        matchID:
          type: string
