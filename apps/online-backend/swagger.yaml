# Written by hand. apps/online-backend/src/server/swagger.test.ts fails when
# the routes here and the ones router.ts serves differ.
openapi: 3.0.0
info:
  title: Teams and Games API
  version: 1.0.0
  description: API for managing teams, games, and matches

servers:
  - url: http://localhost:8000
    description: Local development server

paths:
  /game/admin/{matchId}/logs:
    get:
      summary: Get log data for a specific match
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      security:
      - basicAdminAuth: []
      tags:
      - admin
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"
        "404":
          description: Match not found

  /game/admin/{matchId}/state:
    get:
      summary: Get state data for a specific match
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      security:
      - basicAdminAuth: []
      tags:
      - admin
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/State"
        "404":
          description: Match not found

  /game/admin/{matchId}/addminutes/{minutes}:
    post:
      summary: Add extra time to a specific match
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
        - name: minutes
          in: path
          required: true
          schema:
            type: integer
      security:
      - basicAdminAuth: []
      tags:
      - admin
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddMinutesResponse"
        "404":
          description: Match not found
        "500":
          description: Team not found
        "501":
          description: Restarting finished match not supported

  /game/admin/{matchId}/metadata:
    get:
      summary: Get metadata for a specific match
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      security:
      - basicAdminAuth: []
      tags:
      - admin
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchData"
        "404":
          description: Match not found

  /team/admin/{teamID}/reset/strategy:
    post:
      summary: Reset team's strategy
      description: Note that this request only resets this game's field in teamState. The user will not notice anything during the game, unless he refreshes the page.
      parameters:
        - name: teamID
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/GUID"
      security:
      - basicAdminAuth: []
      tags:
      - admin
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamModel"
        "404":
          description: Team not found

  /team/admin/{teamID}/reset/relay:
    post:
      summary: Reset team's relay
      description: Note that this request only resets this game's field in teamState. The user will not notice anything during the game, unless he refreshes the page.
      parameters:
        - name: teamID
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/GUID"
      security:
      - basicAdminAuth: []
      tags:
      - admin
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamModel"
        "404":
          description: Team not found

  /team/admin/all:
    get:
      summary: Get all teams as full objects
      security:
      - basicAdminAuth: []
      tags:
      - admin
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamModel"
  /team/admin/competitions:
    get:
      summary: The competitions teams can be imported into, whose ids the import's Competition column takes
      security:
      - basicAdminAuth: []
      tags:
      - admin
      responses:
        "200":
          description: Each registered competition's id and metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    metadata:
                      type: object
                      description: The competition's metadata, as `schemas` types it
                    startWindow:
                      allOf:
                      - $ref: "#/components/schemas/StartWindow"
                      nullable: true
                      description: >
                        The start window in force: the one set through the
                        route below, else the one the competition's config
                        gives. Null for any time.
                    configStartWindow:
                      allOf:
                      - $ref: "#/components/schemas/StartWindow"
                      nullable: true
                      description: The one the competition's config gives, which a window set through the route below replaces.
  /team/admin/competitions/{competitionId}/start-window:
    put:
      summary: Set a competition's start window in place of its config's, or return it to its config's
      description: >
        A team with a window of its own keeps that one. Only the start of a
        match is held to the window: a match started in it runs its full time.
      security:
      - basicAdminAuth: []
      tags:
      - admin
      parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                opensAt:
                  type: string
                  nullable: true
                  description: ISO 8601 with an offset; null returns the competition to its config's window.
                  example: "2026-11-20T15:00+01:00"
                closesAt:
                  type: string
                  nullable: true
                  description: ISO 8601 with an offset, after opensAt; left out or null, the window stays open.
      responses:
        "204":
          description: Set
        "400":
          description: Not a window, or a time without an offset, or one closing before it opens
        "401":
          description: Not an organiser
        "404":
          description: No competition with this id
        "415":
          description: The body is not JSON, or there is none
  /team/admin/import:
    put:
      summary: Import teams from a TSV file
      description: |
        This endpoint allows admins to upload a TSV file with team information. The file must be UTF-8 encoded, with a header naming its columns: "Teamname" and "Competition" (required; the competition the row's team enters, by its id or by edition, round and category such as "20 online C"), "Email", "Other", "ID", "Login Code", "Credentials", "Opens At" and "Closes At" (optional; the last two are the team's own start window, ISO 8601 with an offset, in place of its competition's).
      security:
        - basicAdminAuth: []
      tags:
        - admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The TSV file to be uploaded, its name ending in .tsv
              required:
                - file
      responses:
        "200":
          description: Teams imported successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  successful:
                    type: integer
                    description: The number of successfully imported teams
                  failed:
                    type: integer
                    description: The number of teams that failed to import
                  export_table:
                    type: array
                    items:
                      type: array
                      items:
                        type: string
                  logs:
                    type: object
                    properties:
                      sev:
                        type: array
                        items:
                          type: string
                          enum: ["info", "warn", "error"]
                          description: Severity level of log messages
                      value:
                        type: array
                        items:
                          type: string
                        description: Log messages
        "400":
          description: Invalid file format or multiple files uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Description of the import error
  /team/join:
    post:
      summary: Log a team in
      description: >
        The join code is the team's login secret, so it travels in the body,
        never in the path. The answer sets the session cookie that the
        /team/me routes read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  example: "000-0000-000"
      tags:
      - user
      responses:
        "204":
          description: Logged in; the session cookie is set
          headers:
            Set-Cookie:
              schema:
                type: string
                example: durer_team=8eae8669-125c-42e5-8b49-89afbac31679; path=/team/me; httponly; samesite=lax
        "400":
          description: No join code in the body
        "404":
          description: Team not found
        "415":
          description: The body is not JSON, or there is none — a form post cannot log a team in

  /team/me/logout:
    post:
      summary: Log the team out
      description: >
        Expires the session cookie. Succeeds with no session too. The body
        must be JSON — an empty object will do — so that a form another site
        submits cannot log the team out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      tags:
      - user
      responses:
        "204":
          description: Logged out
        "415":
          description: The body is not JSON, or there is none

  /team/me:
    get:
      summary: Get the logged-in team's data
      security:
      - teamSession: []
      tags:
      - user
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTeamView"
        "401":
          description: No session

  /team/me/relay/play:
    post:
      summary: Let the logged-in team start a RELAY match
      security:
      - teamSession: []
      tags:
      - user
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedMatch"
        "401":
          description: No session
        "403":
          description: Not allowed to start — the team already started this match or is playing the other, the competition has no such match, or it is outside the team's start window

  /team/me/strategy/play:
    post:
      summary: Let the logged-in team start a STRATEGY match
      security:
      - teamSession: []
      tags:
      - user
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedMatch"
        "401":
          description: No session
        "403":
          description: Not allowed to start — the team already started this match or is playing the other, the competition has no such match, or it is outside the team's start window

  /team/me/gohome:
    post:
      summary: Let the logged-in team set their PageState to HOME
      security:
      - teamSession: []
      tags:
      - user
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTeamView"
        "401":
          description: No session
        "403":
          description: Not allowed, match in progress

components:
  securitySchemes:
   basicAdminAuth:
    type: http
    scheme: basic
   teamSession:
    type: apiKey
    in: cookie
    name: durer_team
    description: >
      The team's GUID, set by POST /team/join and set afresh by every /team/me
      request it admits. HttpOnly, SameSite=Lax, path /team/me.
  schemas:
    GUID:
      type: string
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
      example: "8eae8669-125c-42e5-8b49-89afbac31679"

    MatchStatus:
      oneOf:
        - $ref: "#/components/schemas/NotStartedMatchStatus"
        - $ref: "#/components/schemas/InProgressMatchStatus"
        - $ref: "#/components/schemas/FinishedMatchStatus"

    NotStartedMatchStatus:
      type: object
      properties:
        state:
          type: string
          enum: ["NOT STARTED"]

    InProgressMatchStatus:
      type: object
      properties:
        state:
          type: string
          enum: ["IN PROGRESS"]
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        matchID:
          type: string

    FinishedMatchStatus:
      type: object
      properties:
        state:
          type: string
          enum: ["FINISHED"]
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        matchID:
          type: string
        score:
          type: number

    PublicTeamView:
      description: >
        What a team is served about itself — the row without its secrets. The
        GUID is one of them: it is the session cookie's value, so serving it
        here would hand any script on the page the session. Note that
        boardgame.io still discloses the same GUID as the match's player name
        once a team has started a match, so this narrows where the session
        travels rather than closing it off — see issue #434.
      type: object
      properties:
        teamName:
          type: string
        category:
          type: string
        competition:
          type: object
          nullable: true
          description: >
            The team's competition without its relay's problems: id, languages,
            the relay's duration, the strategy game and its duration, and
            metadata. Null for a competition the server no longer has.
        startWindow:
          allOf:
          - $ref: "#/components/schemas/StartWindow"
          nullable: true
          description: >
            When the team may start its matches: its own window, else its
            competition's. Null for any time.
        serverTime:
          type: string
          format: date-time
          description: >
            The server's clock as it answers. The page judges the start window
            by it, not by the browser's clock, since the server decides.
        credentials:
          type: string
        pageState:
          type: string
          enum: ["DISCLAIMER", "HOME", "RELAY", "STRATEGY"]
        relayMatch:
          $ref: "#/components/schemas/MatchStatus"
        strategyMatch:
          $ref: "#/components/schemas/MatchStatus"

    TeamModel:
      type: object
      properties:
        teamId:
          type: string
        joinCode:
          type: string
        teamName:
          type: string
        competitionId:
          type: string
        startOpensAt:
          type: string
          nullable: true
          description: The team's own start window's start, ISO 8601 with an offset, in place of its competition's window.
        startClosesAt:
          type: string
          nullable: true
          description: Its end, set only with startOpensAt; null leaves the window open.
        category:
          type: string
        credentials:
          type: string
        email:
          type: string
        pageState:
          type: string
          enum: ["DISCLAIMER", "HOME", "RELAY", "STRATEGY"]
        relayMatchID:
          type: string
          nullable: true
          description: The team's current relay match, the column the status below is read from.
        strategyMatchID:
          type: string
          nullable: true
          description: The team's current strategy match, the column the status below is read from.
        relayMatch:
          $ref: "#/components/schemas/MatchStatus"
        strategyMatch:
          $ref: "#/components/schemas/MatchStatus"
        other:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StartWindow:
      type: object
      description: When a team may start either match. ISO 8601 with an offset; without a closesAt it stays open.
      required: [opensAt]
      properties:
        opensAt:
          type: string
          example: "2026-11-20T15:00+01:00"
        closesAt:
          type: string
          example: "2026-11-20T21:30+01:00"

    ActionShape:
      type: string
      enum: ["MAKE_MOVE", "GAME_EVENT", "UNDO", "REDO"]

    Operation:
      type: object
      # Define properties for Operation if known

    LogEntry:
      type: object
      properties:
        action:
          $ref: "#/components/schemas/ActionShape"
        _stateID:
          type: integer
        turn:
          type: integer
        phase:
          type: string
        redact:
          type: boolean
        automatic:
          type: boolean
        metadata:
          type: object
        patch:
          type: array
          items:
            $ref: "#/components/schemas/Operation"
      required:
        - action
        - _stateID
        - turn
        - phase

    Ctx:
      type: object
      # Define properties for Ctx if known

    PluginState:
      type: object
      # Define properties for PluginState if known

    Undo:
      type: object
      # Define properties for Undo if known

    State:
      type: object
      properties:
        G:
          type: object
          description: The game state. Structure depends on the specific game implementation.
        ctx:
          $ref: "#/components/schemas/Ctx"
        deltalog:
          type: array
          items:
            $ref: "#/components/schemas/LogEntry"
        plugins:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PluginState"
        _undo:
          type: array
          items:
            $ref: "#/components/schemas/Undo"
        _redo:
          type: array
          items:
            $ref: "#/components/schemas/Undo"
        _stateID:
          type: integer
      required:
        - G
        - ctx
        - plugins
        - _stateID

    AddMinutesResponse:
      type: object
      properties:
        updatedEndTime:
          type: string
          format: date-time
        matchID:
          type: string
        team:
          $ref: "#/components/schemas/TeamModel"

    CreatedMatch:
      type: object
      properties:
        matchID:
          type: string

    PlayerMetadata:
      type: object
      additionalProperties: true
      description: Player metadata. Structure depends on the specific game implementation.

    MatchData:
      type: object
      properties:
        gameName:
          type: string
          description: The name of the game.
        players:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PlayerMetadata"
          description: A map of player IDs to their metadata.
        setupData:
          type: object
          nullable: true
          description: Optional setup data for the game.
        gameover:
          type: object
          nullable: true
          description: Information about the game end state, if the game is over.
        nextMatchID:
          type: string
          nullable: true
          description: ID of the next match, if applicable.
        unlisted:
          type: boolean
          nullable: true
          description: Whether the match is unlisted.
        createdAt:
          type: integer
          format: int64
          description: Timestamp of when the match was created.
        updatedAt:
          type: integer
          format: int64
          description: Timestamp of when the match was last updated.
      required:
        - gameName
        - players
        - createdAt
        - updatedAt
