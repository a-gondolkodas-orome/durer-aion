name: pages-deploy
on:
  push:
    branches: [main]
  # Flipping the Pages source in Settings does not itself trigger a build, and neither does
  # changing the custom domain — both need a redeploy a maintainer can start from here.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # This workflow syncs into the year's private repo with everything else (sync.yml), where a
    # push to main would build the site from the secret game and publish it. Only the public
    # repo may run it.
    if: github.repository == 'a-gondolkodas-orome/durer-aion'
    runs-on: ubuntu-24.04
    # Practice's pin, which also satisfies the root .nvmrc (`24`). One container builds both
    # rather than two jobs handing a partial artifact to each other.
    container:
      image: node:24.20.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # offline-frontend's vite config stamps the build with `git rev-parse HEAD`, and in a
      # container job actions/checkout's safe.directory setting is gone by the time a later
      # step runs git — it fails with "detected dubious ownership".
      - name: Let git read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-pages-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-pages-

      # One install for the whole monorepo: apps/strategy-practice is a workspace now, so the root
      # lockfile covers it too.
      - name: Install dependencies
        id: install
        run: npm ci

      # apps/strategy-practice keeps its own gates here, as its deploy workflow did: pr-test only runs on
      # pull requests, so without these a check nobody ran on main would ship. The rest of the
      # monorepo is covered by ci.yml on the same push, and by the build below.
      - name: Check tool versions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/strategy-practice
        run: npm run check:versions
      - name: Lint practice
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/strategy-practice
        run: npm run lint
      - name: Typecheck practice
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/strategy-practice
        run: npm run typecheck
      - name: Test practice
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/strategy-practice
        run: npm run test:unit

      # Builds each app and assembles the one artifact. The same script backs
      # `npm run site:build`, so what a maintainer previews locally with `npm run site:serve`
      # is this deploy's own code — the site root, the subpaths, the CNAME assertion and all.
      # A build failure in any app blocks the whole deploy, the accepted cost of a single site.
      - name: Build and assemble the site
        run: node scripts/assemble-site.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.repository == 'a-gondolkodas-orome/durer-aion'
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # A healthy deployment reports success in well under a minute, so the action's 10
          # minute default only ever delays the report when Pages' queue is stalled.
          timeout: 180000
