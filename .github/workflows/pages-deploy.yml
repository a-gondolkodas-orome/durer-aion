name: pages-deploy
on:
  push:
    branches: [main]
  # Flipping the Pages source in Settings does not itself trigger a build, and neither does
  # changing the custom domain — both need a redeploy a maintainer can start from here.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # The one line that moves the whole site. `/` now that gyakorlo.durerinfo.hu resolves and the
  # site is served from it; it was `/durer-aion/` while it lived on the default Pages domain,
  # where a project site sits under its repo name. Every subpath below is composed from it, so
  # the switch stays one edit rather than one per app. See docs/pages-consolidation.md § Sequence.
  SITE_ROOT: /

jobs:
  build:
    runs-on: ubuntu-24.04
    # Practice's pin, which also satisfies the root .nvmrc (`24`). One container builds both
    # rather than two jobs handing a partial artifact to each other.
    container:
      image: node:24.11.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # offline-frontend's vite config stamps the build with `git rev-parse HEAD`, and in a
      # container job actions/checkout's safe.directory setting is gone by the time a later
      # step runs git — it fails with "detected dubious ownership".
      - name: Let git read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-pages-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-pages-

      # One install for the whole monorepo: apps/strategy-practice is a workspace now, so the root
      # lockfile covers it too.
      - name: Install dependencies
        id: install
        run: npm ci

      # apps/strategy-practice keeps its own gates here, as its deploy workflow did: pr-test only runs on
      # pull requests, so without these a check nobody ran on main would ship. The rest of the
      # monorepo is covered by ci.yml on the same push, and by the build below.
      - name: Check tool versions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/strategy-practice
        run: npm run check:versions
      - name: Lint practice
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/strategy-practice
        run: npm run lint
      - name: Typecheck practice
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/strategy-practice
        run: npm run typecheck
      - name: Test practice
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/strategy-practice
        run: npm run test:unit

      - name: Build strategy game practice
        working-directory: apps/strategy-practice
        run: npm run build
        env:
          SITE_BASE: ${{ env.SITE_ROOT }}jatekok/
      - name: Build the relay practice
        run: npx turbo build --filter=relay-practise-frontend
        env:
          SITE_BASE: ${{ env.SITE_ROOT }}valto/
      - name: Build the competition dry run
        run: npx turbo build --filter=offline-frontend
        env:
          SITE_BASE: ${{ env.SITE_ROOT }}proba-verseny/

      # One artifact, so the layout is assembled here rather than by each app. A build failure
      # in any of them blocks the whole deploy — the accepted cost of a single Pages site.
      - name: Assemble the site
        run: |
          # `set -eu`, not `set -euo pipefail`: this job runs in the node container, where the
          # runner falls back to `sh -e {0}` (dash) — which has no `pipefail` and fails the
          # step on the `set` line itself. Nothing here is a pipeline, so it buys nothing.
          set -eu
          mkdir -p site
          cp -r pages/home/. site/
          mkdir -p site/jatekok && cp -r apps/strategy-practice/dist/. site/jatekok/
          mkdir -p site/valto && cp -r apps/relay-practise-frontend/dist/. site/valto/
          mkdir -p site/proba-verseny && cp -r apps/offline-frontend/dist/. site/proba-verseny/
          # The custom domain is declared by this file at the artifact root, so a deploy that
          # shipped without it would quietly hand the site back to the default domain — with
          # every path in it still root-absolute. Check rather than trust the copy above.
          test "$(cat site/CNAME)" = gyakorlo.durerinfo.hu

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # A healthy deployment reports success in well under a minute, so the action's 10
          # minute default only ever delays the report when Pages' queue is stalled.
          timeout: 180000
