name: CI

on:
  push:
    branches:
      - main
  # Every pull request, whatever it targets — a PR stacked on another branch
  # gets the same gates as one straight onto main.
  pull_request:

# Every job only reads the checkout; nothing here writes to the repository, opens
# an issue or deploys. pages-deploy.yml and dependency-report.yml already declare
# the permissions they need, so this is the last workflow taking the default set.
permissions:
  contents: read

concurrency:
  # A PR's later push supersedes the run still going for the earlier one. On main
  # the group is the sha, which is unique, so a push to main is never cancelled:
  # pages-deploy.yml cuts over on the same push, and the checks behind it have to
  # finish rather than be superseded by the next merge.
  group: ci-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  i18n:
    name: i18n
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run i18n:check

  spell-check:
    name: spell-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run spell-check

  docker:
    name: docker
    runs-on: ubuntu-latest
    # A cold build of the backend image — npm ci and turbo inside it — is the
    # bulk of this, and runs in a few minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # No setup-node, for the same reason dependency-report.yml has none: the
      # only thing run outside docker is the env seeding below, which any Node
      # does, and the image pins its own Node in the Dockerfile — which
      # scripts/check-versions.test.mjs already holds to .nvmrc.
      - name: Seed .env.docker
        # compose is invoked with --env-file, so the gitignored file has to
        # exist. These are the sample values `npm run setup` gives a developer;
        # nothing here starts a container, so they are never used as credentials.
        run: npm run setup
      # The competition is deployed from these two images and nothing else in CI
      # touches them, so a broken Dockerfile or nginx.conf used to surface at
      # deploy time. No compose overlay: this is the production image set, the
      # one `npm run stack:prod` builds.
      - name: Build the deployed images
        run: npm run stack:build
