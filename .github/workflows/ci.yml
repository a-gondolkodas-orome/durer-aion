name: CI

on:
  push:
    branches:
      - main
  # Every pull request, whatever it targets — a PR stacked on another branch
  # gets the same gates as one straight onto main.
  pull_request:

# Every job only reads the checkout; nothing here writes to the repository, opens
# an issue or deploys. pages-deploy.yml and dependency-report.yml already declare
# the permissions they need, so this is the last workflow taking the default set.
permissions:
  contents: read

concurrency:
  # A PR's later push supersedes the run still going for the earlier one. Keyed on
  # the pull request rather than on its head branch, because one branch can have
  # two pull requests open — a stacked one and the same work onto main — and a
  # push then starts a run for each, which a shared group would have cancelling
  # its sibling. On a push the key falls back to the sha, which is unique, so a
  # run on main is never cancelled: pages-deploy.yml cuts the public site over on
  # that same push, and the checks behind it have to finish rather than be
  # superseded by the next merge.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # The six gates that need only an install, one job each so they run in
  # parallel and each reports under its own check name. The name is the npm
  # script too, except where an entry below says otherwise.
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Each gate says something on its own; a lint failure should not hide
      # whether the tests pass.
      fail-fast: false
      matrix:
        check: [lint, typecheck, test, build, i18n, spell-check]
        include:
          - check: i18n
            script: i18n:check
          # A ceiling rather than a reservation: it caps each eslint process turbo spawns
          # instead of leaving V8 to size the heap at half of whatever RAM the runner
          # happens to have — 8 GB on a public repo's, a third of that on a smaller one.
          # Every workspace lints in under 1024 MB,
          # so this is headroom and a regression guard at once: if lint's memory creeps
          # back up, it fails here, where it is visible, rather than only where the
          # runner is smallest. .devcontainer/README.md has the measurements.
          - check: lint
            node-options: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run "$SCRIPT"
        env:
          SCRIPT: ${{ matrix.script || matrix.check }}
          NODE_OPTIONS: ${{ matrix.node-options }}

  docker:
    name: docker
    runs-on: ubuntu-latest
    # A cold build of the backend image — npm ci and turbo inside it — is the
    # bulk of this, and runs in a few minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Needed even though nothing is installed here: the seeding below goes
      # through `npm run`, and devEngines in the root package.json requires npm
      # ^11, where the runner's default Node still ships 10. dependency-report.yml
      # is the workflow that can skip this, because it calls `node` directly.
      # No `cache: npm`, since there is no npm ci to feed from it.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Seed .env.docker
        # compose is invoked with --env-file, so the gitignored file has to
        # exist. These are the sample values `npm run setup` gives a developer;
        # nothing here starts a container, so they are never used as credentials.
        run: npm run setup
      # The competition is deployed from these two images and nothing else in CI
      # touches them, so a broken Dockerfile or nginx.conf would otherwise surface
      # at deploy time. No compose overlay: this is the production image set, the
      # one `npm run stack:prod` builds.
      - name: Build the deployed images
        run: npm run stack:build
