name: sync

on:
  push:
    branches:
      - sync-*

# Nothing here writes to this repository: the checkout below carries no credential, and the only
# thing pushed to is the private mirror, over PRIVATE_PAT.
permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'a-gondolkodas-orome/durer-aion'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # For the script alone — it clones the branch it syncs itself, so that one code path is the
      # one scripts/sync-mirror.test.mjs exercises.
      - uses: actions/checkout@v7
        with:
          # Otherwise actions/checkout writes an `http.https://github.com/.extraheader` credential
          # into the config, and that header is host-wide: git would send this repository's token
          # to the private mirror in place of the PAT.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # What this does, and why it is a script rather than the shell that used to be inline here,
      # is in scripts/sync-mirror.mjs. No `npm ci`: it uses node builtins and git, nothing else.
      - name: Sync with private repository
        # Passed as environment variables rather than expanded into the command: a `${{ }}` inside
        # a `run:` body is substituted before the shell sees it, so a branch name would arrive as
        # executable text rather than as a value.
        env:
          PRIVATE_REPO_NAME: ${{ secrets.PRIVATE_REPO_NAME }}
          PRIVATE_PAT: ${{ secrets.PRIVATE_PAT }}
          REF: ${{ github.ref_name }}
        run: node scripts/sync-mirror.mjs
