name: dependency-report
on:
  schedule:
    # 06:00 UTC on the 1st. GitHub disables a scheduled workflow after 60 days without
    # repository activity — the explanation for a month that passes silently.
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    # #308 guarded sync.yml and pages-deploy.yml the same way. This one is a cron with
    # `issues: write`, so in the year's private mirror it would open dependency issues
    # there every month, about the public repo's dependencies, on billed minutes.
    if: github.repository == 'a-gondolkodas-orome/durer-aion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # This job's token can write issues, and a checkout would leave it in .git/config for
          # every later step — the install below included — to read.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # For semver, which reads the range a held-back package's blocker declares (HELD_BACK in
      # dependency-report.mjs). No lifecycle scripts: nothing here needs one, and each would be
      # third-party code running beside that token.
      - name: Install
        run: npm ci --ignore-scripts
      - name: Collect outdated versions
        id: report
        # stdout goes to the run summary, so a run stays readable whatever happens to the issue
        # below. The script never exits non-zero: an unreachable registry is a row, not a failure.
        run: node scripts/dependency-report.mjs --out dependency-report.md >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconcile the report issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEHIND: ${{ steps.report.outputs.behind }}
          # One report for the whole repo, so one issue. Matched on this title below, so it is
          # the issue's identity — renaming it by hand orphans the old one and opens a new one.
          TITLE: Dependency update report
        run: |
          # Matched on the title, not the OPS label, so a hand-edited label cannot cause a
          # duplicate issue. --limit outruns gh's default page of 30.
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | first | .number // empty")

          if [ "$BEHIND" = 'true' ] && [ -n "$number" ]; then
            # Edit rather than comment: editing a body sends no notification, so the only one
            # worth having is the issue appearing in the first place.
            gh issue edit "$number" --body-file dependency-report.md
          elif [ "$BEHIND" = 'true' ]; then
            gh issue create --title "$TITLE" --label OPS --body-file dependency-report.md
          elif [ -n "$number" ]; then
            # Closed silently: the maintainer just merged the upgrades that made it current.
            gh issue close "$number" --reason completed
          fi
