name: CI:practice
on:
  pull_request:
    # apps/strategy-practice has its own vitest suite, Vite build and coverage gate, so most of
    # the monorepo cannot change what these jobs measure — but its dependencies resolve through
    # the root lockfile, so that counts too. Lint is not among them: one root `eslint .` covers
    # this app through its own eslint.config.js, and ci.yml runs it on every PR.
    paths:
      - 'apps/strategy-practice/**'
      # The engine and games packages are this app's code, moved out (PRs 1.2a and 1.4):
      # their specs run in this suite and patch-coverage gates their added lines, so a
      # package-only PR must trigger both.
      - 'packages/engine/**'
      - 'packages/games/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/practice-pr-test.yml'

concurrency:
  group: practice-pr-test-${{ github.head_ref }}
  cancel-in-progress: true

# Every `run:` here is an npm script of apps/strategy-practice. It is a workspace of the root
# project now, so the install below is the exception — it runs at the repository root.
defaults:
  run:
    working-directory: apps/strategy-practice

jobs:
  test:
    # ci.yml also has a job called `test`, and the checks list shows job names, not workflow
    # names — two entries reading `test` would be ambiguous both to a reader and to whoever
    # configures required checks.
    name: practice-test
    runs-on: ubuntu-24.04
    container:
      image: node:24.20.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      # At the root, not in apps/strategy-practice: there is one lockfile now, and `npm ci` from a
      # workspace directory installs that workspace's subtree and leaves the root's own
      # dependencies unmet — which the other apps then fail to build against.
      - name: Install dependencies
        id: install
        working-directory: .
        run: npm ci
      # Each check runs even after an earlier one failed, so a red build names every problem
      # at once rather than only the first.
      - name: Check tool versions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:versions
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:unit
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

  # A separate job rather than a step of `test`: the coverage run is the suite again and
  # instrumented, so it belongs alongside the checks a contributor is waiting on rather than after
  # them, and a PR failing it still reads as passing everything else at a glance. The
  # `skip coverage` label skips rather than fails it (AGENTS.md § Coverage).
  patch-coverage:
    name: patch-coverage
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip coverage') }}
    runs-on: ubuntu-24.04
    container:
      image: node:24.20.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The merge base has to exist locally for `<base>...HEAD` to resolve; the default shallow
          # fetch gives one commit and the diff would come out as the whole repository.
          fetch-depth: 0
      # actions/checkout marks the workspace safe itself, but under a HOME it overrides for the
      # duration of its own steps, so in a container job the setting is gone by the time a later
      # `run:` calls git — which fails with "detected dubious ownership" rather than anything about
      # ownership being fine. The other jobs never notice: they run npm, not git.
      - name: Let git read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - name: Install dependencies
        working-directory: .
        run: npm ci
      # Deliberately not `npm run coverage` — see the comment atop scripts/patch-coverage.mjs.
      - name: Measure coverage without the sweeps
        run: npm run coverage:unswept -- --coverage.reporter=lcovonly
      # base.sha is the base branch as of the last sync, which is exactly the merge base the diff
      # should be taken against — commits landed on main since are not this PR's to cover. The base
      # is not always the default branch: a PR stacked on another PR is measured against that PR's
      # branch, and everything it merged from the default branch to get there would otherwise count
      # as its own. `--upstream` is what the script subtracts; `fetch-depth: 0` above is what puts
      # the ref in the checkout.
      - name: Report coverage of added lines
        run: >-
          node scripts/patch-coverage.mjs
          --base ${{ github.event.pull_request.base.sha }}
          --upstream origin/${{ github.event.pull_request.base.repo.default_branch }}
